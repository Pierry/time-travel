name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: lint, tests and gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The repository is the machine that produces the trips. This checks the
      # machine: a leg with no skill, versions that disagree, a badge that lies,
      # a dash in prose.
      - name: repository structure
        run: python3 sensors/repo_lint.py

      - name: gate tests, every rule both ways
        run: python3 sensors/test_sensors.py --verbose

      - name: calendar export tests
        run: python3 scripts/test_alarms_ics.py --verbose

      # A green suite proves the gate agrees with itself. These steps prove it
      # still releases a complete trip and still refuses the moves that make a
      # premortem worthless.
      - name: gate releases the example trip
        run: python3 sensors/trip_lint.py --artifact sensors/fixtures/trip.md --phase all

      - name: gate refuses reassurance
        run: |
          sed 's/- Hidden assumption: that/- Hidden assumption: great plan overall, but/' sensors/fixtures/trip.md > "$RUNNER_TEMP/t1.md"
          if python3 sensors/trip_lint.py --artifact "$RUNNER_TEMP/t1.md"; then
            echo "the gate released a reassuring trip"; exit 1
          fi

      - name: gate refuses a cause traced to nothing
        run: |
          sed 's/- Traces to: D7/- Traces to: the market/' sensors/fixtures/trip.md > "$RUNNER_TEMP/t2.md"
          if python3 sensors/trip_lint.py --artifact "$RUNNER_TEMP/t2.md" --phase autopsy; then
            echo "the gate released generic advice"; exit 1
          fi

      - name: gate refuses an alarm that cannot be measured
        run: |
          sed 's/| under 20% of launch week trials |/| much lower than launch |/' sensors/fixtures/trip.md > "$RUNNER_TEMP/t3.md"
          if python3 sensors/trip_lint.py --artifact "$RUNNER_TEMP/t3.md" --phase alarm; then
            echo "the gate released an alarm with no number"; exit 1
          fi

      - name: hook gates trip files and ignores everything else
        run: |
          printf '{"tool_input":{"file_path":"%s"}}' "$PWD/sensors/fixtures/trip.md" | bash hooks/post-write-trip.sh
          printf '{"tool_input":{"file_path":"%s"}}' "$RUNNER_TEMP/t2.md" | bash hooks/post-write-trip.sh
          cp "$RUNNER_TEMP/t2.md" "$RUNNER_TEMP/trip.md"
          set +e
          printf '{"tool_input":{"file_path":"%s"}}' "$RUNNER_TEMP/trip.md" | bash hooks/post-write-trip.sh 2>/dev/null
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "the hook returned $code on a broken trip, expected 2"; exit 1; }

      - name: calendar export runs
        run: |
          python3 scripts/alarms_ics.py --artifact sensors/fixtures/trip.md --out "$RUNNER_TEMP/alarms.ics"
          test "$(grep -c BEGIN:VEVENT "$RUNNER_TEMP/alarms.ics")" -eq 7

      - name: shell scripts parse
        run: |
          bash -n install.sh
          bash -n hooks/post-write-trip.sh

  version:
    name: a plugin change carries a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every merge to main is a release. A PR that changes what users install
      # without a new version would merge and release nothing, so it stops here.
      - name: compare with the base branch
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "$changed"
          if ! echo "$changed" | grep -qvE '^(\.github/|README\.md$|docs/|CHANGELOG\.md$)'; then
            echo "only docs or CI changed, no release needed"; exit 0
          fi
          old="$(git show "$base:.claude-plugin/plugin.json" | jq -r .version)"
          new="$(jq -r .version .claude-plugin/plugin.json)"
          echo "base $old, head $new"
          if [ "$old" = "$new" ]; then
            echo "plugin files changed but the version is still $old: bump it in the three manifests and add a CHANGELOG entry"; exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "version $new is not above $old"; exit 1
          fi
