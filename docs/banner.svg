<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <!-- Cloud Dancer, Pantone 11-4201 TCX, approximated in sRGB -->
  <rect width="1600" height="560" fill="#F0EEE9"/>

  <!-- wordmark -->
  <text x="96" y="132" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#8A8578">A PREMORTEM AGENT FOR CLAUDE CODE AND CODEX</text>
  <text x="88" y="282" font-family="Snell Roundhand, Apple Chancery, cursive" font-size="176" fill="#23211C">time-travel</text>
  <text x="98" y="352" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#23211C">Your plan died six months from now.</text>
  <text x="98" y="396" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#8A8578">Here is the autopsy.</text>

  <!-- the five legs -->
  <g font-family="Menlo, SF Mono, monospace" font-size="16" fill="#23211C">
    <g transform="translate(98 446)">
      <rect width="104" height="36" rx="18" fill="none" stroke="#23211C" stroke-width="1.5"/>
      <text x="52" y="23" text-anchor="middle">autopsy</text>
    </g>
    <g transform="translate(214 446)">
      <rect width="98" height="36" rx="18" fill="none" stroke="#23211C" stroke-width="1.5"/>
      <text x="49" y="23" text-anchor="middle">verdict</text>
    </g>
    <g transform="translate(324 446)">
      <rect width="98" height="36" rx="18" fill="none" stroke="#23211C" stroke-width="1.5"/>
      <text x="49" y="23" text-anchor="middle">rebuild</text>
    </g>
    <g transform="translate(434 446)">
      <rect width="118" height="36" rx="18" fill="none" stroke="#23211C" stroke-width="1.5"/>
      <text x="59" y="23" text-anchor="middle">adversary</text>
    </g>
    <g transform="translate(564 446)">
      <rect width="84" height="36" rx="18" fill="#E4572E"/>
      <text x="42" y="23" text-anchor="middle" fill="#F0EEE9">alarm</text>
    </g>
  </g>

  <!-- timeline: today to the day it died -->
  <line x1="1000" y1="408" x2="1452" y2="408" stroke="#23211C" stroke-width="3" stroke-linecap="round"/>
  <g fill="#23211C">
    <circle cx="1090" cy="408" r="4"/><circle cx="1180" cy="408" r="4"/>
    <circle cx="1270" cy="408" r="4"/><circle cx="1360" cy="408" r="4"/>
  </g>
  <circle cx="1000" cy="408" r="13" fill="#F0EEE9" stroke="#23211C" stroke-width="3"/>
  <circle cx="1000" cy="408" r="5" fill="#E4572E"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#8A8578" text-anchor="middle">
    <text x="1000" y="450">today</text>
    <text x="1180" y="450">m2</text>
    <text x="1360" y="450">m4</text>
    <text x="1472" y="450">+6 months</text>
  </g>

  <!-- tombstone with a clock, flat -->
  <g transform="translate(1410 230)">
    <path d="M0 178 V64 C0 26 28 4 62 4 C96 4 124 26 124 64 V178 Z" fill="#23211C"/>
    <circle cx="62" cy="76" r="36" fill="#F0EEE9"/>
    <line x1="62" y1="76" x2="62" y2="52" stroke="#23211C" stroke-width="5" stroke-linecap="round"/>
    <line x1="62" y1="76" x2="44" y2="88" stroke="#E4572E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="76" r="4.5" fill="#23211C"/>
    <text x="62" y="152" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#F0EEE9">R.I.P.</text>
  </g>

  <!-- the trip back -->
  <path d="M1452 214 C1400 96 1080 92 1012 372" fill="none" stroke="#E4572E" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M1000 352 L1012 380 L1030 356" fill="none" stroke="#E4572E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1232" y="118" text-anchor="middle" font-family="Snell Roundhand, Apple Chancery, cursive" font-size="44" fill="#E4572E">the autopsy comes back</text>
</svg>
