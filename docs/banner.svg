<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0620"/>
      <stop offset="0.55" stop-color="#2A0B45"/>
      <stop offset="1" stop-color="#4A0F4F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="0.5" stop-color="#FF7A1F"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0630"/>
      <stop offset="1" stop-color="#07020F"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E8AA6"/>
      <stop offset="1" stop-color="#4C4766"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9FDFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5EF3FF" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#7B2CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#FF2E88" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="1600" height="402"/>
    </clipPath>
    <clipPath id="floorclip">
      <rect x="0" y="402" width="1600" height="238"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="1600" height="640" fill="url(#sky)"/>
  <g fill="#FFFFFF">
    <circle cx="80" cy="60" r="1.6" opacity="0.8"/><circle cx="210" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="340" cy="40" r="1.8" opacity="0.9"/><circle cx="470" cy="110" r="1.1" opacity="0.5"/>
    <circle cx="610" cy="30" r="1.4" opacity="0.7"/><circle cx="760" cy="90" r="1.9" opacity="0.9"/>
    <circle cx="880" cy="22" r="1.2" opacity="0.6"/><circle cx="990" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="1130" cy="36" r="1.1" opacity="0.5"/><circle cx="1260" cy="120" r="1.7" opacity="0.8"/>
    <circle cx="1390" cy="50" r="1.3" opacity="0.7"/><circle cx="1520" cy="96" r="1.8" opacity="0.9"/>
    <circle cx="150" cy="250" r="1.1" opacity="0.4"/><circle cx="560" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="1450" cy="230" r="1.2" opacity="0.5"/><circle cx="1050" cy="180" r="1" opacity="0.4"/>
  </g>

  <!-- synthwave sun, sliced -->
  <g clip-path="url(#sunclip)">
    <circle cx="1120" cy="330" r="190" fill="url(#sun)" opacity="0.95"/>
    <g fill="url(#sky)">
      <rect x="900" y="300" width="440" height="6"/>
      <rect x="900" y="326" width="440" height="9"/>
      <rect x="900" y="354" width="440" height="12"/>
      <rect x="900" y="384" width="440" height="15"/>
    </g>
  </g>

  <!-- floor grid -->
  <rect x="0" y="402" width="1600" height="238" fill="url(#floor)"/>
  <g clip-path="url(#floorclip)" stroke="#FF2E88" stroke-width="1.6" opacity="0.75" fill="none">
    <line x1="0" y1="402" x2="1600" y2="402" stroke="#FF7AC0" stroke-width="2.5"/>
    <line x1="0" y1="414" x2="1600" y2="414"/>
    <line x1="0" y1="430" x2="1600" y2="430"/>
    <line x1="0" y1="452" x2="1600" y2="452"/>
    <line x1="0" y1="482" x2="1600" y2="482"/>
    <line x1="0" y1="522" x2="1600" y2="522"/>
    <line x1="0" y1="576" x2="1600" y2="576"/>
    <line x1="800" y1="402" x2="-1400" y2="640"/>
    <line x1="800" y1="402" x2="-800" y2="640"/>
    <line x1="800" y1="402" x2="-250" y2="640"/>
    <line x1="800" y1="402" x2="250" y2="640"/>
    <line x1="800" y1="402" x2="620" y2="640"/>
    <line x1="800" y1="402" x2="980" y2="640"/>
    <line x1="800" y1="402" x2="1350" y2="640"/>
    <line x1="800" y1="402" x2="1850" y2="640"/>
    <line x1="800" y1="402" x2="2400" y2="640"/>
    <line x1="800" y1="402" x2="3000" y2="640"/>
  </g>

  <!-- title block -->
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="88" y="150" font-size="22" font-weight="700" letter-spacing="6" fill="#5EF3FF">A PREMORTEM AGENT FOR CLAUDE CODE AND CODEX</text>
    <text x="84" y="250" font-size="112" font-weight="800" fill="#FFFFFF" letter-spacing="-2" filter="url(#titleglow)">time-travel</text>
    <text x="88" y="310" font-size="34" font-weight="600" fill="#FFD9EC">Your plan died six months from now.</text>
    <text x="88" y="356" font-size="34" font-weight="600" fill="#FFD9EC">Here is the autopsy.</text>
  </g>

  <!-- leg chips -->
  <g font-family="Menlo, SF Mono, monospace" font-size="17" font-weight="700">
    <g transform="translate(88 440)">
      <rect width="118" height="38" rx="19" fill="#120726" stroke="#FF7A1F" stroke-width="2"/>
      <text x="59" y="25" text-anchor="middle" fill="#FFB27A">autopsy</text>
    </g>
    <g transform="translate(218 440)">
      <rect width="112" height="38" rx="19" fill="#120726" stroke="#FF2E88" stroke-width="2"/>
      <text x="56" y="25" text-anchor="middle" fill="#FF8CC4">verdict</text>
    </g>
    <g transform="translate(342 440)">
      <rect width="112" height="38" rx="19" fill="#120726" stroke="#B26BFF" stroke-width="2"/>
      <text x="56" y="25" text-anchor="middle" fill="#D2A8FF">rebuild</text>
    </g>
    <g transform="translate(466 440)">
      <rect width="130" height="38" rx="19" fill="#120726" stroke="#5EF3FF" stroke-width="2"/>
      <text x="65" y="25" text-anchor="middle" fill="#A8F8FF">adversary</text>
    </g>
    <g transform="translate(608 440)">
      <rect width="96" height="38" rx="19" fill="#120726" stroke="#FFD23F" stroke-width="2"/>
      <text x="48" y="25" text-anchor="middle" fill="#FFE58A">alarm</text>
    </g>
  </g>
  <rect x="76" y="494" width="760" height="44" rx="10" fill="#0B0620" opacity="0.85"/>
  <text x="92" y="524" font-family="Menlo, SF Mono, monospace" font-size="20" fill="#9B8FC0">&gt; /time-travel:premortem launch in 8 weeks, $5k, 200 customers</text>

  <!-- portal -->
  <ellipse cx="1300" cy="300" rx="150" ry="190" fill="url(#portal)" filter="url(#soft)"/>
  <ellipse cx="1300" cy="300" rx="112" ry="150" fill="none" stroke="#5EF3FF" stroke-width="5" filter="url(#glow)"/>
  <ellipse cx="1300" cy="300" rx="92" ry="128" fill="none" stroke="#B26BFF" stroke-width="3" opacity="0.8" stroke-dasharray="18 10"/>
  <ellipse cx="1300" cy="300" rx="70" ry="102" fill="#E9FDFF" opacity="0.35"/>

  <!-- tombstone -->
  <g transform="translate(905 238)">
    <ellipse cx="105" cy="246" rx="150" ry="18" fill="#000" opacity="0.45"/>
    <path d="M0 240 V80 C0 20 50 0 105 0 C160 0 210 20 210 80 V240 Z" fill="url(#stone)" stroke="#2B2640" stroke-width="4"/>
    <path d="M14 232 V84 C14 34 56 14 105 14" fill="none" stroke="#B9B5CF" stroke-width="3" opacity="0.6"/>
    <path d="M178 22 l-10 12 l8 9 l-8 13" fill="none" stroke="#2B2640" stroke-width="3"/>
    <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="#1B1730">
      <text x="105" y="62" font-size="16" font-weight="700" letter-spacing="3">HERE LIES</text>
      <text x="105" y="96" font-size="30" font-weight="800">YOUR PLAN</text>
      <text x="105" y="122" font-size="14" font-weight="700" letter-spacing="1">OCT 2026 · APR 2027</text>
      <text x="105" y="160" font-size="15" font-style="italic" font-weight="600">"we'll figure out</text>
      <text x="105" y="180" font-size="15" font-style="italic" font-weight="600">distribution later"</text>
    </g>
    <!-- toe tag -->
    <g transform="translate(222 196) rotate(12)">
      <path d="M0 6 C-10 -4 -14 -20 -20 -40" fill="none" stroke="#FFD23F" stroke-width="2"/>
      <rect x="0" y="-6" width="64" height="34" rx="5" fill="#FFF4D6" stroke="#C98A1A" stroke-width="2"/>
      <circle cx="8" cy="11" r="3" fill="#C98A1A"/>
      <text x="38" y="9" font-family="Menlo, monospace" font-size="9" font-weight="700" fill="#5A3A00" text-anchor="middle">CAUSE #1</text>
      <text x="38" y="22" font-family="Menlo, monospace" font-size="9" fill="#5A3A00" text-anchor="middle">70% likely</text>
    </g>
  </g>

  <!-- the coroner from the future -->
  <g transform="translate(1240 182)">
    <ellipse cx="62" cy="304" rx="70" ry="12" fill="#000" opacity="0.4"/>
    <!-- legs -->
    <rect x="34" y="236" width="20" height="62" rx="8" fill="#2B2640"/>
    <rect x="70" y="236" width="20" height="62" rx="8" fill="#2B2640"/>
    <rect x="26" y="290" width="34" height="14" rx="7" fill="#111"/>
    <rect x="66" y="290" width="34" height="14" rx="7" fill="#111"/>
    <!-- lab coat -->
    <path d="M16 118 C16 98 34 88 62 88 C90 88 108 98 108 118 L118 246 H6 Z" fill="#F4F2FF" stroke="#2B2640" stroke-width="3"/>
    <path d="M62 92 L50 140 L62 246 M62 92 L74 140" fill="none" stroke="#B9B5CF" stroke-width="3"/>
    <rect x="80" y="150" width="18" height="22" rx="3" fill="#E1DEF2" stroke="#B9B5CF" stroke-width="2"/>
    <line x1="85" y1="148" x2="85" y2="160" stroke="#FF2E88" stroke-width="3"/>
    <!-- arm with clipboard -->
    <path d="M22 122 C-4 150 -14 176 -10 196" fill="none" stroke="#F4F2FF" stroke-width="20" stroke-linecap="round"/>
    <path d="M22 122 C-4 150 -14 176 -10 196" fill="none" stroke="#2B2640" stroke-width="3" stroke-dasharray="0" opacity="0"/>
    <g transform="translate(-62 150) rotate(-8)">
      <rect width="64" height="84" rx="6" fill="#C98A1A" stroke="#5A3A00" stroke-width="3"/>
      <rect x="7" y="12" width="50" height="66" rx="2" fill="#FFFDF5"/>
      <rect x="22" y="4" width="20" height="10" rx="3" fill="#8A8FA0"/>
      <text x="32" y="30" font-family="Menlo, monospace" font-size="9" font-weight="700" fill="#B3001B" text-anchor="middle">AUTOPSY</text>
      <g stroke="#6B6585" stroke-width="2">
        <line x1="13" y1="40" x2="51" y2="40"/><line x1="13" y1="49" x2="45" y2="49"/>
        <line x1="13" y1="58" x2="51" y2="58"/><line x1="13" y1="67" x2="39" y2="67"/>
      </g>
    </g>
    <circle cx="-12" cy="198" r="10" fill="#F2C9A0" stroke="#2B2640" stroke-width="2"/>
    <!-- other arm, pointing at the stone -->
    <path d="M102 124 C130 140 150 150 170 146" fill="none" stroke="#F4F2FF" stroke-width="20" stroke-linecap="round" transform="scale(-1 1) translate(-124 0)"/>
    <!-- head -->
    <circle cx="62" cy="58" r="36" fill="#F2C9A0" stroke="#2B2640" stroke-width="3"/>
    <!-- wild white hair -->
    <path d="M24 52 C6 40 10 18 26 20 C18 2 42 -6 50 10 C52 -8 78 -8 80 10 C90 -4 114 4 104 22 C122 22 124 44 102 52 C112 34 92 24 84 34 C78 22 50 22 44 34 C36 26 20 34 24 52 Z" fill="#FFFFFF" stroke="#2B2640" stroke-width="3"/>
    <path d="M22 62 C8 66 6 84 18 90 M102 62 C116 66 118 84 106 90" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <!-- goggles -->
    <rect x="26" y="46" width="72" height="8" fill="#2B2640"/>
    <circle cx="46" cy="54" r="14" fill="#5EF3FF" stroke="#2B2640" stroke-width="4" filter="url(#glow)"/>
    <circle cx="78" cy="54" r="14" fill="#5EF3FF" stroke="#2B2640" stroke-width="4" filter="url(#glow)"/>
    <circle cx="42" cy="50" r="4" fill="#FFFFFF"/>
    <circle cx="74" cy="50" r="4" fill="#FFFFFF"/>
    <!-- deadpan mouth -->
    <path d="M50 80 H74" stroke="#2B2640" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(1268 26)">
    <path d="M0 18 C0 8 8 0 18 0 H294 C304 0 312 8 312 18 V74 C312 84 304 92 294 92 H90 L62 120 L66 92 H18 C8 92 0 84 0 74 Z" fill="#FFFFFF" stroke="#2B2640" stroke-width="3"/>
    <text x="156" y="40" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1730">I've seen how this ends.</text>
    <text x="156" y="70" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="800" fill="#FF2E88">Sit down.</text>
  </g>
</svg>
